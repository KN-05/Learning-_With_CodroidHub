<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Students collaborating</title>
  <desc id="desc">Illustration of students working together around a laptop and open notebook</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16233B"/>
      <stop offset="100%" stop-color="#243654"/>
    </linearGradient>
  </defs>
  <rect width="640" height="440" rx="18" fill="url(#bgGrad)"/>

  <!-- ruled lines -->
  <g stroke="#3A4B6B" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="150" x2="640" y2="150"/>
    <line x1="0" y1="220" x2="640" y2="220"/>
    <line x1="0" y1="290" x2="640" y2="290"/>
    <line x1="0" y1="360" x2="640" y2="360"/>
  </g>

  <!-- desk -->
  <rect x="60" y="300" width="520" height="18" rx="4" fill="#C89B3C"/>

  <!-- laptop -->
  <g transform="translate(230,210)">
    <rect x="0" y="0" width="180" height="110" rx="6" fill="#EFEDE4"/>
    <rect x="10" y="10" width="160" height="90" rx="2" fill="#16233B"/>
    <rect x="-20" y="110" width="220" height="14" rx="4" fill="#C9C4B4"/>
  </g>

  <!-- student left -->
  <g transform="translate(120,150)">
    <circle cx="30" cy="30" r="28" fill="#C89B3C"/>
    <rect x="0" y="60" width="60" height="90" rx="16" fill="#3C7A5B"/>
  </g>

  <!-- student right -->
  <g transform="translate(460,150)">
    <circle cx="30" cy="30" r="28" fill="#B33A3A"/>
    <rect x="0" y="60" width="60" height="90" rx="16" fill="#2D4A7A"/>
  </g>

  <!-- open notebook -->
  <g transform="translate(300,330)">
    <path d="M0 0 L45 -10 L90 0 L90 40 L45 30 L0 40 Z" fill="#EFEDE4"/>
    <line x1="45" y1="-10" x2="45" y2="30" stroke="#C9C4B4" stroke-width="2"/>
  </g>

  <!-- floating grade badge -->
  <g transform="translate(520,60)">
    <circle cx="0" cy="0" r="26" fill="#3C7A5B"/>
    <text x="0" y="8" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" fill="#EFEDE4" font-weight="600">A</text>
  </g>
</svg>
